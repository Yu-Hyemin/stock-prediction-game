name: Update stock game data

on:
  schedule:
    # 매일 KST 01:00 = 전날 UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stock-game-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 최신 게임 데이터 만들기
        run: python scraper.py

      - name: 변경된 데이터 저장
        run: |
          if git diff --quiet -- game_data.json; then
            echo "변경된 데이터가 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_data.json
          git commit -m "chore: update stock game data"
          git push
