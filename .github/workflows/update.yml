name: Update stock game data

on:
  schedule:
    # GitHub Actions의 cron은 UTC 기준입니다.
    # 현재 설정: 평일 KST 18:00 = UTC 09:00
    # KST 원하는 시각에서 9시간을 빼고 아래 첫 두 숫자(분, 시)를 바꾸세요.
    # 예: 매일 KST 20:30 -> '30 11 * * *'
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Actions 화면에서 언제든 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-stock-game-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 최신 게임 데이터 만들기
        run: python scraper.py

      - name: 변경된 데이터 저장
        run: |
          if git diff --quiet -- game_data.json; then
            echo "변경된 데이터가 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_data.json
          git commit -m "chore: update stock game data"
          git push
